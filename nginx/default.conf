# Serves the MapLibre page and reverse-proxies tiles under the same origin.
# The page requests /tiles/... so there is no cross-origin request and no CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/geo+json;

    # Static site
    location / {
        try_files $uri $uri/ =404;
    }

    # embed.js is loaded by pages on other origins (arkansasonline.com). Kept on a
    # short TTL so a fix to the embed reaches those pages the same day.
    location = /embed.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Assets the embed pulls cross-origin: the vendored MapLibre build and the
    # boundary/city GeoJSON. These change only with a redeploy, so cache a day.
    location ~* \.(js|css)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # .geojson is absent from nginx's mime.types, so it would ship as
    # application/octet-stream and be skipped by gzip. Set the type per-location
    # rather than with a server-level `types` block — that would REPLACE the
    # inherited mime map wholesale and break every other content type.
    location ~* \.geojson$ {
        default_type application/geo+json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Tile server: /tiles/<source>/<z>/<x>/<y>  ->  martin:3000/<source>/<z>/<x>/<y>
    # Also proxies the TileJSON at /tiles/<source>.
    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Rewrite-URL $request_uri;

        # Cache tiles at the edge/browser; bump when data is refreshed.
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
