<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Arkansas Crash Density</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  /* The controls and legend are part of the page, not a floating overlay, so the
     layout is a column: chrome at natural height, map taking whatever is left. */
  *, *:before, *:after { box-sizing: border-box; }   /* else .wrap's padding overflows its 100% height */
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; color: #111; }
  .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px 16px; }
  h1 { font-size: 17px; line-height: 1.25; margin: 0 0 10px; }

  /* Two filters side by side while each fits ~220px, stacked below that. */
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 0 0 10px; }
  /* Grow to share the row, but stop before the selects look absurdly wide. */
  .field { flex: 1 1 220px; min-width: 0; max-width: 340px; }
  .field label { display: block; font-weight: 600; font-size: 13px; margin: 0 0 4px; }
  .field select {
    display: block; width: 100%; padding: 6px 8px; font-family: inherit; font-size: 14px;
    color: #111; background: #fff; border: 1px solid #bbb; border-radius: 4px;
  }

  .hint { text-align: center; font-size: 13px; color: #555; margin: 0 0 8px; }
  #map { flex: 1 1 auto; min-height: 320px; position: relative; }

  /* Bin-size badge, then the legend as one horizontal run; wraps on narrow screens. */
  .legendwrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 10px 0 0; }
  .hexbadge svg { display: block; }
  .hexbadge polygon { fill: #f2f2f2; stroke: #555; stroke-width: 1.5; }
  .hexbadge text { font-family: inherit; font-size: 13px; font-weight: 600; fill: #111; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 0; font-size: 13px; }
  .legend-title { font-weight: 600; }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend .swatch { width: 18px; height: 12px; flex: 0 0 auto; border: 1px solid rgba(0,0,0,0.25); }
  .legend .dot { width: 12px; height: 12px; border-radius: 50%; }
  .meta { margin: 8px 0 0; color: #666; font-size: 12px; }
  .maplibregl-popup-content { font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Arkansas Crashes (2021–2025)</h1>

  <div class="controls">
    <div class="field">
      <label for="measure">Filter by</label>
      <select id="measure">
        <option value="crash_count">Crash count</option>
        <option value="fatalities">Fatalities</option>
        <option value="injuries">Serious injuries</option>
        <option value="ped_count">Pedestrian</option>
        <option value="cmv_count">Commercial vehicle</option>
        <option value="impaired_count">Impaired / DUI</option>
      </select>
    </div>
    <div class="field">
      <label for="year">Year</label>
      <select id="year">
        <option value="0">All years</option>
        <option value="2021">2021</option>
        <option value="2022">2022</option>
        <option value="2023">2023</option>
        <option value="2024">2024</option>
        <option value="2025">2025</option>
      </select>
    </div>
  </div>

  <div class="hint">Zoom in for details on individual crashes</div>

  <div id="map"></div>

  <div class="legendwrap">
    <!-- Pointy-top hexagon, matching the bins on the map; hidden at point zoom. -->
    <span class="hexbadge" id="hexbadge" title="Current hexagon size">
      <svg viewBox="0 0 46 52" width="46" height="52" role="img" aria-label="Hexagon bin size">
        <polygon points="23,1 45,13.75 45,38.25 23,51 1,38.25 1,13.75"></polygon>
        <text id="hexsize" x="23" y="26" dy="0.35em" text-anchor="middle">8 km</text>
      </svg>
    </span>
    <div class="legend" id="legend"></div>
  </div>
  <div class="meta">Source: Arkansas State Patrol via ARDOT</div>
</div>

<script>
// Tile base: same-origin "/tiles" behind nginx in production, or override for a
// native Martin, e.g. index.html?tiles=http://localhost:3000
//
// Absolutized deliberately. MapLibre loads vector tiles and URL-based GeoJSON
// sources from a Web Worker, whose base URL is a blob: — a relative URL cannot be
// resolved there and every tile fails with "... is not a valid URL" before a
// request is sent (the source still reports isSourceLoaded=true, with zero
// features). Main-thread fetches are unaffected, which makes the failure look
// selective. Any URL handed to a source must therefore be absolute.
const TILE_BASE = new URL(
  new URLSearchParams(location.search).get('tiles') || '/tiles',
  location.href
).href.replace(/\/+$/, '');

// Sequential warm ramp (light -> dark red), colorblind-safe-ish for density.
const RAMP = ['#ffffb2', '#fecc5c', '#fd8d3c', '#f03b20', '#bd0026', '#7a0177'];

// Each "Filter by" option maps to a hex measure column (drives the color ramp
// and, with the >0 filter, which hexes show) and a point filter (which crashes
// render at high zoom). Pseudo-log breakpoints read well across all four hex
// resolutions; finer hexes simply use the lower range.
const MEASURES = {
  crash_count:    { label: 'Crash count',        breaks: [1, 10, 50, 250, 1500, 8000], pointFilter: null },
  fatalities:     { label: 'Fatalities',         breaks: [1, 2, 5, 15, 40, 120],       pointFilter: ['>', ['get', 'numfatalities'], 0] },
  injuries:       { label: 'Serious injuries',   breaks: [1, 3, 10, 40, 150, 600],     pointFilter: ['>', ['get', 'numserinj'], 0] },
  ped_count:      { label: 'Pedestrian',         breaks: [1, 3, 10, 30, 100, 400],     pointFilter: ['get', 'nonmotoristrelated'] },
  cmv_count:      { label: 'Commercial vehicle', breaks: [1, 5, 20, 75, 250, 1000],    pointFilter: ['get', 'cmvrelated'] },
  impaired_count: { label: 'Impaired / DUI',     breaks: [1, 4, 15, 50, 150, 600],     pointFilter: ['get', 'impairedrelated'] },
};

const HEX_LAYERS = ['lyr-hex-8km', 'lyr-hex-3km', 'lyr-hex-1km', 'lyr-hex-400m'];
let currentMeasure = 'crash_count';   // kept in sync for the hex hover popup

// Crash severity (KABCO). Single source of truth for BOTH the point layer's
// colors and the severity legend, so they can't drift. `value` is the exact DB
// string; anything unmatched falls to SEVERITY_DEFAULT.
const SEVERITY = [
  { value: 'Fatal Injury (K)',              label: 'Fatal (K)',           color: '#7a0177' },
  { value: 'Suspected Serious Injury (A)',  label: 'Serious injury (A)',  color: '#bd0026' },
  { value: 'Suspected Minor Injury (B)',    label: 'Minor injury (B)',    color: '#f03b20' },
  { value: 'Possible Injury (C)',           label: 'Possible injury (C)', color: '#fd8d3c' },
];
const SEVERITY_DEFAULT = { label: 'No apparent injury (O)', color: '#4575b4' };
const POINT_ZOOM = 13;   // points appear at z >= 13; legend swaps to severity here

// Arkansas cutout: a world-covering fill with the state as a hole masks
// everything outside Arkansas. MASK_COLOR matches the page background so the
// state appears to float; WORLD_RING is the mask's outer ring.
const MASK_COLOR = '#ffffff';
const WORLD_RING = [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]];

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: [-92.3, 34.9],   // central Arkansas
  zoom: 7.8,
  maxBounds: [[-97.0, 31.5], [-87.5, 38.0]],
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'imperial' }), 'bottom-left');

function fillColorExpr(measure) {
  const b = MEASURES[measure].breaks;
  return [
    'interpolate', ['linear'], ['get', measure],
    b[0], RAMP[0], b[1], RAMP[1], b[2], RAMP[2],
    b[3], RAMP[3], b[4], RAMP[4], b[5], RAMP[5],
  ];
}

function buildLegend(measure) {
  const b = MEASURES[measure].breaks;
  const items = RAMP.map((c, i) => {
    const lo = b[i];
    const hi = b[i + 1];
    const label = hi ? `${lo.toLocaleString()}–${hi.toLocaleString()}` : `${lo.toLocaleString()}+`;
    return `<span class="item"><span class="swatch" style="background:${c}"></span>${label}</span>`;
  }).join('');
  document.getElementById('legend').innerHTML =
    `<span class="legend-title">${MEASURES[measure].label}</span>${items}`;
}

function buildSeverityLegend() {
  const items = [...SEVERITY, SEVERITY_DEFAULT].map(s =>
    `<span class="item"><span class="swatch dot" style="background:${s.color}"></span>${s.label}</span>`
  ).join('');
  document.getElementById('legend').innerHTML = `<span class="legend-title">Crash severity</span>${items}`;
}

// Show the severity legend at point zoom, the measure legend at hex zoom.
// `force` rebuilds even when the mode is unchanged (used on dropdown changes).
let legendMode = null;
function refreshLegend(force) {
  const mode = map.getZoom() >= POINT_ZOOM ? 'severity' : 'measure';
  if (!force && mode === legendMode) return;
  legendMode = mode;
  if (mode === 'severity') buildSeverityLegend();
  else buildLegend(document.getElementById('measure').value);
}

// Apply both dropdowns to hexes (color by measure + hide zero/other-year hexes)
// and points (filter by category AND year). Called on load and on any change.
function applyState() {
  const measure = document.getElementById('measure').value;
  const year = parseInt(document.getElementById('year').value, 10);
  currentMeasure = measure;

  const expr = fillColorExpr(measure);
  // Hexes: show only the selected year bucket (0 = all-years rollup) and only
  // hexes with a non-zero value for the chosen measure.
  const hexFilter = ['all', ['==', ['get', 'year'], year], ['>', ['get', measure], 0]];
  for (const id of HEX_LAYERS) {
    map.setPaintProperty(id, 'fill-color', expr);
    map.setFilter(id, hexFilter);
  }

  // Points: AND the category filter with the year filter (omit year clause for All).
  const clauses = [];
  const pf = MEASURES[measure].pointFilter;
  if (pf) clauses.push(pf);
  if (year !== 0) clauses.push(['==', ['get', 'year'], year]);
  map.setFilter('lyr-points', clauses.length ? ['all', ...clauses] : null);

  refreshLegend(true);
}

function addHexLayer(id, source, sourceLayer, minzoom, maxzoom) {
  map.addLayer({
    id, type: 'fill', source, 'source-layer': sourceLayer, minzoom, maxzoom,
    paint: {
      'fill-color': fillColorExpr('crash_count'),
      'fill-opacity': 0.65,
      'fill-outline-color': 'rgba(0,0,0,0.15)',
    },
  });
}

map.on('load', () => {
  // Vector sources — explicit tile templates (proxy-safe, no TileJSON needed).
  map.addSource('hex_8km',  { type: 'vector', tiles: [`${TILE_BASE}/hex_8km/{z}/{x}/{y}`],  minzoom: 0, maxzoom: 8 });
  map.addSource('hex_3km',  { type: 'vector', tiles: [`${TILE_BASE}/hex_3km/{z}/{x}/{y}`],  minzoom: 6, maxzoom: 10 });
  map.addSource('hex_1km',  { type: 'vector', tiles: [`${TILE_BASE}/hex_1km/{z}/{x}/{y}`],  minzoom: 9, maxzoom: 13 });
  map.addSource('hex_400m', { type: 'vector', tiles: [`${TILE_BASE}/hex_400m/{z}/{x}/{y}`], minzoom: 11, maxzoom: 14 });
  map.addSource('crash_points', { type: 'vector', tiles: [`${TILE_BASE}/crash_points/{z}/{x}/{y}`], minzoom: 11, maxzoom: 16 });

  // Hex bands (visible one at a time; MapLibre layer maxzoom is exclusive).
  addHexLayer('lyr-hex-8km',  'hex_8km',  'hex_8km',  0, 8);
  addHexLayer('lyr-hex-3km',  'hex_3km',  'hex_3km',  8, 10);
  addHexLayer('lyr-hex-1km',  'hex_1km',  'hex_1km',  10, 12);
  addHexLayer('lyr-hex-400m', 'hex_400m', 'hex_400m', 12, 13);

  // Individual crashes at high zoom, colored by severity.
  map.addLayer({
    id: 'lyr-points', type: 'circle', source: 'crash_points', 'source-layer': 'crash_points',
    minzoom: 13,
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 2.5, 18, 6],
      'circle-color': [
        'match', ['get', 'crashseverity'],
        ...SEVERITY.flatMap(s => [s.value, s.color]),
        SEVERITY_DEFAULT.color,   // No Apparent Injury (O) + anything else
      ],
      'circle-opacity': 0.8,
      'circle-stroke-width': 0.5,
      'circle-stroke-color': 'rgba(0,0,0,0.4)',
    },
  });

  // Initialize paint, filters and legend from the current dropdown values.
  applyState();
  updateLayerInfo();

  // Hex hover popup. Shows the visible year bucket's totals, plus the active
  // category count when a category (not a base measure) is selected.
  const CATEGORY_LABELS = { ped_count: 'pedestrian', cmv_count: 'commercial-vehicle', impaired_count: 'impaired' };
  const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
  for (const id of HEX_LAYERS) {
    map.on('mousemove', id, (e) => {
      map.getCanvas().style.cursor = 'pointer';
      const p = e.features[0].properties;
      let html = `<b>${(+p.crash_count).toLocaleString()}</b> crashes<br>` +
                 `${p.fatalities} fatalities · ${p.injuries} serious injuries`;
      if (CATEGORY_LABELS[currentMeasure]) {
        html += `<br>${(+p[currentMeasure]).toLocaleString()} ${CATEGORY_LABELS[currentMeasure]}`;
      }
      popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
    });
    map.on('mouseleave', id, () => { map.getCanvas().style.cursor = ''; popup.remove(); });
  }

  // Point click popup. `row` renders a labeled line only when the value exists,
  // so missing/blank fields are silently skipped rather than showing "null".
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const row = (label, val) =>
    (val === null || val === undefined || val === '') ? '' : `<br><b>${label}:</b> ${esc(val)}`;
  map.on('click', 'lyr-points', (e) => {
    const p = e.features[0].properties;
    const when = [p.crashdate, p.crashtime].filter(Boolean).join(' · ');
    const place = [p.city, p.county ? p.county + ' County' : null].filter(Boolean).join(', ');
    const html =
      `<b>${esc(p.crashseverity)}</b>` +
      (when ? `<br>${esc(when)}` : '') +
      (place ? `<br>${esc(place)}` : '') +
      row('Description', p.crashmanner) +
      row('Conditions', p.roadwaysurfaceconidtion) +
      row('Lighting', p.lightingconditions) +
      row('Agency', p.agencyname) +
      `<br><b>Fatalities:</b> ${p.numfatalities} · <b>Serious inj:</b> ${p.numserinj}`;
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
  });
  map.on('mouseenter', 'lyr-points', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'lyr-points', () => map.getCanvas().style.cursor = '');

  // Arkansas cutout mask + boundary outline (added last, so they sit on top).
  fetch('arkansas.geojson').then(r => r.json()).then(gj => {
    const geom = gj.geometry || gj;
    const holes = geom.type === 'MultiPolygon'
      ? geom.coordinates.map(poly => poly[0])   // each piece's outer ring becomes a hole
      : [geom.coordinates[0]];
    map.addSource('ar-mask', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'Polygon', coordinates: [WORLD_RING, ...holes] } },
    });
    map.addLayer({
      id: 'ar-mask-fill', type: 'fill', source: 'ar-mask',
      paint: { 'fill-color': MASK_COLOR, 'fill-opacity': 1 },
    });
    map.addSource('ar-outline', { type: 'geojson', data: gj });
    map.addLayer({
      id: 'ar-outline-line', type: 'line', source: 'ar-outline',
      paint: {
        'line-color': '#333333',
        'line-width': ['interpolate', ['linear'], ['zoom'], 6, 1.2, 12, 2],
      },
    });

    // Arkansas city labels (Census places, 2023 pop). Above the mask so edge-city
    // labels are never clipped; hex zooms only (hidden once points take over).
    // Reuse a basemap font so the glyphs are guaranteed to exist.
    const fonts = map.getStyle().layers
      .filter(l => l.type === 'symbol')
      .map(l => map.getLayoutProperty(l.id, 'text-font'))
      .filter(Boolean);
    const cityFont = fonts.find(f => f.some(n => /Regular/i.test(n)))
                  || fonts.find(f => f.some(n => /Medium/i.test(n)))
                  || fonts[0] || ['Noto Sans Regular'];
    // Absolute for the same worker reason as TILE_BASE — a GeoJSON source given
    // a relative URL is silently never fetched.
    map.addSource('ar-cities', { type: 'geojson', data: new URL('ar_cities.geojson', location.href).href });
    map.addLayer({
      id: 'lyr-cities', type: 'symbol', source: 'ar-cities',
      maxzoom: POINT_ZOOM,                 // hex zoom levels only
      layout: {
        'text-field': ['get', 'name'],
        'text-font': cityFont,
        // moderate size scaling by population
        'text-size': ['interpolate', ['linear'], ['get', 'pop'],
                      1000, 10, 10000, 12.5, 50000, 15, 100000, 17, 200000, 20],
        'text-max-width': 8,
        'text-padding': 10,   // larger collision margin -> fewer labels at low zoom
        'symbol-sort-key': ['-', 0, ['get', 'pop']],  // larger cities placed first, win collisions
        'text-allow-overlap': false,        // collision detection on (hide overlapping labels)
        'icon-allow-overlap': false,
      },
      paint: {
        'text-color': '#000000',
        'text-halo-color': '#ffffff',
        'text-halo-width': 1.4,
        'text-halo-blur': 0.4,
      },
    });
  });
});

// Edge length of the hex layer currently in view; null at point zoom, where
// nothing is binned and the badge is hidden (the severity legend takes over).
function hexSizeLabel(z) {
  return z < 8 ? '8 km' : z < 10 ? '3 km' : z < 12 ? '1 km' : z < POINT_ZOOM ? '400 m' : null;
}

function updateLayerInfo() {
  const label = hexSizeLabel(map.getZoom());
  document.getElementById('hexbadge').style.display = label ? '' : 'none';
  if (label) document.getElementById('hexsize').textContent = label;
}
map.on('zoom', () => { updateLayerInfo(); refreshLegend(false); });

document.getElementById('measure').addEventListener('change', applyState);
document.getElementById('year').addEventListener('change', applyState);
</script>
</body>
</html>
